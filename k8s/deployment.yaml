apiVersion: apps/v1
kind: Deployment
metadata:
  name: pc-price-tracker
  namespace: pc-price-tracker
  labels:
    app.kubernetes.io/name: pc-price-tracker
spec:
  # SQLite: keep a single replica so writers don't corrupt the DB
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pc-price-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pc-price-tracker
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: app
          # Replace with your registry image, e.g.:
          # ghcr.io/your-org/pc-price-tracker:1.0.0
          image: pc-price-tracker:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATA_DIR
              value: /data
            - name: DB_PATH
              value: /data/prices.db
            - name: CATALOG_PATH
              value: /data/products.yaml
            - name: TZ
              value: Asia/Jerusalem
            - name: PORT
              value: "8000"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: catalog
              mountPath: /data/products.yaml
              subPath: products.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pc-price-tracker-data
        - name: catalog
          configMap:
            name: pc-price-tracker-catalog
