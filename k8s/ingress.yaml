# Optional — enable when you have an Ingress controller (nginx, AGIC, Traefik, etc.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pc-price-tracker
  namespace: pc-price-tracker
  labels:
    app.kubernetes.io/name: pc-price-tracker
  annotations:
    # nginx example:
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: pc-prices.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pc-price-tracker
                port:
                  name: http
  # tls:
  #   - hosts:
  #       - pc-prices.example.com
  #     secretName: pc-price-tracker-tls
